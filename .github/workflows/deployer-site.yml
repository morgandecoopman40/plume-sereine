# Génère le site (blog depuis Supabase) et le publie sur GitHub Pages.
# Prérequis : Settings → Pages → Source = « GitHub Actions ».
name: Déployer le site

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'   # chaque nuit (vers 4 h / 5 h, heure de Paris)
  workflow_dispatch:       # bouton « Run workflow » dans l'onglet Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Générer le site (articles publiés lus dans Supabase)
        run: node scripts/generer-blog.mjs

      - name: Vérifier qu'aucun fichier de travail n'est publié
        run: |
          for f in CLAUDE.md seo scripts .github _config.yml .gitignore; do
            if [ -e "_site/$f" ]; then
              echo "::error::_site/$f ne doit pas être publié"; exit 1
            fi
          done
          echo "Fichiers publiés :"; (cd _site && find . -type f | sort)

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deployer:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
